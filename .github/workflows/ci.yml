name: CI Build & Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build APS.Core
        run: dotnet build APS-Suite/src/APS.Core/APS.Core.csproj -c Release

      - name: Build APS.Core.Tests
        run: dotnet build APS-Suite/tests/APS.Core.Tests/APS.Core.Tests.csproj -c Release

      - name: Run SP 484 & RIP Unit Tests
        run: dotnet test APS-Suite/tests/APS.Core.Tests/APS.Core.Tests.csproj -c Release --no-build --verbosity normal
